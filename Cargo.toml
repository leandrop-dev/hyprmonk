[workspace]
resolver = "3"
members = ["crates/hyprmonk"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/leandrop-dev/hyprmonk"

[workspace.dependencies]
anyhow = "1"
rustix = { version = "1", features = ["event"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
