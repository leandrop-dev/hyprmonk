# cava for the bar's spectrum (services/Cava.qml): what the default output
# plays, as ten bands of 0-100 per line on stdout.

[general]
framerate = 30
# After a second of silence cava stops sending lines (it would send zeros 30
# times a second, and the bar would redraw for each).
sleep_timer = 1
bars = 10
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
