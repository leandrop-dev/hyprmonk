font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
# The background takes the tone's card opacity (kitty-tone.conf), and Hyprland
# blurs behind it. A reload only changes the opacity with this on from start.
dynamic_background_opacity yes

# Colours: Noir's 16, then text, background and cursor from matugen (the
# wallpaper), then the Appearance tone's own if it has them (written by the
# shell). Later lines win; a file not there yet is skipped.
include noir.conf
include ~/.local/state/hyprmonk/theme/kitty.conf
include ~/.local/state/hyprmonk/theme/kitty-tone.conf
