# hypridle (hyprmonk-idle.service): lock after 10 minutes idle, screens off a
# minute later, and lock before every suspend. Locking goes through logind
# (`loginctl lock-session`), which hypridle turns into the shell's lock.

general {
    lock_cmd         = qs -c hyprmonk ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# An action Hyprland does not know toggles the screens: keep these exact.
listener {
    timeout    = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
